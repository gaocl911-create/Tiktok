--- # 临时文件存储位置 避免临时文件被系统清理报错
spring.servlet.multipart.location: /ruoyi/server/temp

--- # 生产环境硬覆盖：关闭 swagger / 收紧 actuator / 强制非弱密钥
springdoc.api-docs.enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sa-token:
  # 必须显式注入 SA_TOKEN_JWT_SECRET（建议 64+ 字符随机串），缺失时 fail-fast。
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:?SA_TOKEN_JWT_SECRET must be set in prod}

api-decrypt:
  # 加解密 keypair 必须由部署侧生成并注入；不允许回退到代码中的历史值。
  publicKey: ${API_DECRYPT_RESPONSE_PUBLIC_KEY:?API_DECRYPT_RESPONSE_PUBLIC_KEY must be set in prod}
  privateKey: ${API_DECRYPT_REQUEST_PRIVATE_KEY:?API_DECRYPT_REQUEST_PRIVATE_KEY must be set in prod}

--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: ${MONITOR_CLIENT_ENABLED:false}
  url: ${MONITOR_ADMIN_URL:http://localhost:9090/admin}
  instance:
    service-host-type: IP
    metadata:
      username: ${spring.boot.admin.client.username}
      userpassword: ${spring.boot.admin.client.password}
  username: @monitor.username@
  password: @monitor.password@

--- # creator monitor external data providers
creator:
  monitor:
    local-scheduler:
      enabled: ${CREATOR_LOCAL_SCHEDULER_ENABLED:false}
  tikhub:
    enabled: ${TIKHUB_ENABLED:false}
    api-base-url: ${TIKHUB_API_BASE_URL:https://api.tikhub.io}
    api-token: ${TIKHUB_API_TOKEN:}
    timeout-seconds: ${TIKHUB_TIMEOUT_SECONDS:15}
    daily-budget-usd: ${TIKHUB_DAILY_BUDGET_USD:5}
    estimated-unit-price-usd: ${TIKHUB_ESTIMATED_UNIT_PRICE_USD:0.001}
    usd-to-cny-rate: ${TIKHUB_USD_TO_CNY_RATE:7.2}

miniapp:
  wechat:
    appid: ${WECHAT_MINIAPP_APPID:?WECHAT_MINIAPP_APPID must be set in prod}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:?WECHAT_MINIAPP_APP_SECRET must be set in prod}
    api-base-url: ${WECHAT_MINIAPP_API_BASE_URL:https://api.weixin.qq.com}
    # prod 永远关闭模拟登录；即使 env 误传 true 也会被 XcxAuthStrategy 的 profile guard 拦下。
    mock-enabled: false

--- # snail-job 配置
snail-job:
  enabled: true
  # 需要在 SnailJob 后台组管理创建对应名称的组,然后创建任务的时候选择对应的组,才能正确分派任务
  group: "ruoyi_group"
  # SnailJob 接入验证令牌：必须通过环境变量注入；缺失时 fail-fast。
  # 历史默认值 SJ_cKqBTPzCsWA3VyuCfFoccmuIEGXjr5KT 已视为泄露，部署前必须轮换并同步更新 sj_group_config 表。
  token: ${SNAIL_JOB_TOKEN:?SNAIL_JOB_TOKEN must be set in prod}
  server:
    host: ${SNAIL_JOB_SERVER_HOST:${SNAIL_JOB_HOST:127.0.0.1}}
    port: ${SNAIL_JOB_SERVER_PORT:${SNAIL_JOB_PORT:17888}}
  # 命名空间UUID 详见 script/sql/ry_job.sql `sj_namespace`表`unique_id`字段
  namespace: ${spring.profiles.active}
  # 随主应用端口漂移
  port: 2${server.port}
  # 客户端ip指定
  host:

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: false
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=${MYSQL_USE_SSL:false}&serverTimezone=Asia/Shanghai&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
          username: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set in prod}
          password: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in prod}
#        # 从库数据源
#        slave:
#          lazy: true
#          type: ${spring.datasource.type}
#          driverClassName: com.mysql.cj.jdbc.Driver
#          url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
#          username:
#          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password: root
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password: root
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password: root
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring.data:
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # redis 密码必须配置 — prod 强制非空。
    password: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in prod}
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl.enabled: false

# redisson 配置
redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 16
  # Netty线程池数量
  nettyThreads: 32
  # 单节点配置
  singleServerConfig:
    # 客户端名称 不能用中文
    clientName: RuoYi-Vue-Plus
    # 最小空闲连接数
    connectionMinimumIdleSize: 32
    # 连接池大小
    connectionPoolSize: 64
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # sms 短信 支持 阿里云 腾讯云 云片 等等各式各样的短信服务商
# https://sms4j.com/doc3/ 差异配置文档地址 支持单厂商多配置，可以配置多个同时使用
sms:
  # 配置源类型用于标定配置来源(interface,yaml)
  config-type: yaml
  # 用于标定yml中的配置是否开启短信拦截，接口配置不受此限制
  restricted: true
  # 短信拦截限制单手机号每分钟最大发送，只对开启了拦截的配置有效
  minute-max: 1
  # 短信拦截限制单手机号每日最大发送量，只对开启了拦截的配置有效
  account-max: 30
  # 以下配置来自于 org.dromara.sms4j.provider.config.BaseConfig类中
  blends:
    # 唯一ID 用于发送短信寻找具体配置 随便定义别用中文即可
    # 可以同时存在两个相同厂商 例如: ali1 ali2 两个不同的阿里短信账号 也可用于区分租户
    config1:
      # 框架定义的厂商名称标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: alibaba
      # 有些称为accessKey有些称之为apiKey，也有称为sdkKey或者appId。
      access-key-id: 您的accessKey
      # 称为accessSecret有些称之为apiSecret
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId
    config2:
      # 厂商标识，标定此配置是哪个厂商，详细请看厂商标识介绍部分
      supplier: tencent
      access-key-id: 您的accessKey
      access-key-secret: 您的accessKeySecret
      signature: 您的短信签名
      sdk-app-id: 您的sdkAppId

