services:
  mysql:
    image: mysql:8.0.42
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-13307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    volumes:
      - tiktok_platform_mysql_data:/var/lib/mysql
      - ../server/script/sql/ry_vue_5.X.sql:/docker-entrypoint-initdb.d/01-ry-vue.sql:ro
      - ../server/script/sql/ry_job.sql:/docker-entrypoint-initdb.d/02-ry-job.sql:ro
      - ../server/script/sql/ry_workflow.sql:/docker-entrypoint-initdb.d/03-ry-workflow.sql:ro
      - ../sql/creator_monitor_schema.sql:/docker-entrypoint-initdb.d/10-creator-monitor-schema.sql:ro
      - ../sql/creator_monitor_menu.sql:/docker-entrypoint-initdb.d/11-creator-monitor-menu.sql:ro
      - ../sql/creator_alert_migration.sql:/docker-entrypoint-initdb.d/12-creator-alert-migration.sql:ro
      - ../sql/creator_monitor_delete_menu.sql:/docker-entrypoint-initdb.d/13-creator-monitor-delete-menu.sql:ro
      - ../sql/creator_snailjob_job.sql:/docker-entrypoint-initdb.d/14-creator-snailjob-job.sql:ro
      - ../sql/creator_monitor_p0_repair.sql:/docker-entrypoint-initdb.d/15-creator-monitor-p0-repair.sql:ro
      - ../sql/parttime_staff_schema.sql:/docker-entrypoint-initdb.d/16-parttime-staff-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
    ports:
      - "${REDIS_PUBLISHED_PORT:-16380}:6379"
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    volumes:
      - tiktok_platform_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruoyi123}
    ports:
      - "${MINIO_API_PUBLISHED_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PUBLISHED_PORT:-19001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - tiktok_platform_minio_data:/data

  snailjob:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.snailjob
    image: tiktok-platform-snailjob:latest
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-snailjob
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ry-vue}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SNAIL_JOB_SERVER_HOST: snailjob
      SNAIL_JOB_SERVER_PORT: 17888
      SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
    ports:
      - "${SNAILJOB_WEB_PUBLISHED_PORT:-18800}:8800"
      - "${SNAILJOB_SERVER_PUBLISHED_PORT:-17889}:17888"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: tiktok-platform-api:latest
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8088
      MONITOR_CLIENT_ENABLED: "false"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
      SNAIL_JOB_SERVER_HOST: snailjob
      SNAIL_JOB_SERVER_PORT: 17888
      SNAIL_JOB_HOST: api
      SNAIL_JOB_PORT: 28088
      TIKHUB_ENABLED: ${TIKHUB_ENABLED:-false}
      TIKHUB_API_TOKEN: ${TIKHUB_API_TOKEN:-}
      WECHAT_MINIAPP_APPID: ${WECHAT_MINIAPP_APPID:-}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET:-}
      WECHAT_MINIAPP_MOCK_ENABLED: ${WECHAT_MINIAPP_MOCK_ENABLED:-true}
      MINIAPP_WECHAT_APPID: ${WECHAT_MINIAPP_APPID:-}
      MINIAPP_WECHAT_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET:-}
      MINIAPP_WECHAT_MOCK_ENABLED: ${WECHAT_MINIAPP_MOCK_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${API_PUBLISHED_PORT:-8088}:8088"
    volumes:
      - tiktok_platform_api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      snailjob:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: tiktok-platform-web:latest
    container_name: ${CONTAINER_PREFIX:-tiktok-platform}-web
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISHED_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  tiktok_platform_mysql_data:
  tiktok_platform_redis_data:
  tiktok_platform_minio_data:
  tiktok_platform_api_logs:
