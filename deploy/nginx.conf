# ===========================================================================
# Web 入口 nginx 配置 — 生产环境
#
# 部署前确认：
#   1. SSL 证书已经放到 ./ssl/fullchain.pem 和 ./ssl/privkey.pem
#      （阿里云/腾讯云免费 DV 证书均可，注意带上证书链）
#   2. server_name 改成你备案过的实际域名
#   3. snail-job 控制台不再走公网 —— 如需访问，从内网 SSH 隧道或加 allow/deny
# ===========================================================================

# 80 → 443 强制跳转。微信小程序要求 HTTPS，且 sa-token 走 HTTP 等于明文。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    # ⚠️ 部署时替换成真实域名，避免 Host header 攻击。
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # —— 安全响应头 ——
    # HSTS：浏览器记住一年内只走 HTTPS；证书申请完成、能稳定续签后再放开 max-age。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 谨慎放开 Permissions-Policy；如需相机/麦克风请按业务调整。
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # 仅图片/作品截图上传走大 body；管理端绝大多数接口都不需要 100m。
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://api:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 上传/作品图：单独放宽 body 限制，避免 20m 卡到图片上传。
    location /prod-api/resource/oss/upload {
        client_max_body_size 100m;
        proxy_pass http://api:8088/resource/oss/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # SnailJob 控制台不再通过公网 nginx 暴露。
    # 如需访问，用 SSH 隧道：
    #   ssh -L 18800:snailjob:8800 user@server
    # 再访问 http://localhost:18800/snail-job
    #
    # 真的非公网不可（强烈不建议）时，再启用下面这段并替换 ALLOWED_IP：
    # location /snail-job/ {
    #     allow <ALLOWED_IP>;
    #     deny  all;
    #     proxy_pass http://snailjob:8800/snail-job/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
